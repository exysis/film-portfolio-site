  <script>
  const intro = document.getElementById("intro");
  const video = document.getElementById("introVideo");

  const fadeDuration = 0.9; // seconds (match CSS)
  const fadeStartTime = video.duration - 0.9; 
  // fade begins 2 seconds before video ends

  video.addEventListener("loadedmetadata", () => {
    const startFadeAt = video.duration - 0.9; 
    // change 2 to however early you want

    let hasFaded = false;
  video.addEventListener("timeupdate", () => {
    if (!hasFaded && video.currentTime >= startFadeAt) {
    hasFaded = true;
    intro.classList.add("fade-out");

    setTimeout(() => {
      intro.style.display = "none";
      document.body.style.overflow = "auto";
    }, fadeDuration * 1000);
  }
});
  });
</script>
